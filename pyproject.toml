[project]
name = "cempasuchil"
version = "0.1.0"
description = "Sahuaris: la flor que México le prestó al mundo. De dónde viene el cempasúchil de nuestros altares, con datos abiertos del SIAP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "kaleido>=1.5.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
]

[tool.pyright]
extraPaths = ["."]

[tool.pyrefly]
search-path = ["."]
